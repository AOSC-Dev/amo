<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.aosc.Amo"/>
    <allow send_destination="io.aosc.Amo"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.aosc.Amo" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.aosc.Amo" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.aosc.Amo" send_interface="io.aosc.Amo1"/>
    <allow send_destination="io.aosc.Amo" send_interface="io.aosc.Amo.Transaction"/>
  </policy>
</busconfig>

