[package]
name = "amo"
version = "0.3.1"
edition = "2024"

[dependencies]
zbus = "5"
zbus_polkit = "5.0.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
oma-refresh = "0.56"
oma-pm = "0.64"
anyhow = "1"
oma-utils = { version = "0.13", features = ["dpkg"] }
apt-auth-config = "0.6"
oma-fetch = "0.38"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest-middleware = "0.5.2"
os_pipe = "1"
tracing-tree = { version = "0.4.1", features = ["time"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "tls12",
] }
notify = "8"
chrono = "0.4"

[dev-dependencies]
futures-util = "0.3.32"
dialoguer = "0.12.0"
debconf = "0.1"
